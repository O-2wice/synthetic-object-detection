project:
  type: website
  output-dir: docs
  resources:
    - assets/social-card.png
    - assets/favicon.png
    - notes/AUDIT.md
    - notes/DATA.md
    - notes/COLAB.md
    - outputs/completed-run/metrics/*.json
    - outputs/completed-run/yolo/results.csv
    - outputs/completed-run/provenance.json
  render:
    - index.qmd

website:
  title: "Synthetic Object Detection"
  description: "A custom ResNet18 detector and YOLOv8n on a controlled single-object task."
  site-url: "https://o-2wice.github.io/synthetic-object-detection/"
  repo-url: "https://github.com/O-2wice/synthetic-object-detection"
  # Social preview and canonical URL. Without these a shared link renders as a
  # bare URL with no title, description or image, and search engines have no
  # single preferred address for the page.
  favicon: assets/favicon.png
  image: assets/social-card.png
  # 1200x630 is the size link previews crop to; a taller figure gets centre-cropped
  # and loses its caption area.
  open-graph:
    image-width: 1200
    image-height: 630
    locale: en_GB
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: Report
      - text: Notebook
        href: https://github.com/O-2wice/synthetic-object-detection/blob/main/notebooks/object-detection.ipynb
      - text: Open in Colab
        href: https://colab.research.google.com/github/O-2wice/synthetic-object-detection/blob/main/notebooks/object-detection.ipynb
      # Spelled out as well as shown as an icon on the right: an unlabelled glyph
      # in the corner is easy to miss, and the repository is the main thing a
      # reader wants after the report.
      - text: Code
        href: https://github.com/O-2wice/synthetic-object-detection
    right:
      - icon: github
        href: https://github.com/O-2wice/synthetic-object-detection
        aria-label: GitHub repository

  page-footer:
    border: true
    left: "Source, data and the executed notebook: [github.com/O-2wice/synthetic-object-detection](https://github.com/O-2wice/synthetic-object-detection)"
    right: "[Report an issue](https://github.com/O-2wice/synthetic-object-detection/issues) &nbsp;·&nbsp; [Notebook](https://github.com/O-2wice/synthetic-object-detection/blob/main/notebooks/object-detection.ipynb)"

format:
  html:
    lang: en
    # cosmo/darkly stay as the base so the layout matches the other reports; the
    # project SCSS layers a palette on top, taken from this project's own figures.
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    smooth-scroll: true
    df-print: paged

execute:
  enabled: false
  freeze: auto
  cache: false
  warning: false
  message: false
