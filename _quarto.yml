project:
  type: website
  output-dir: docs
  resources:
    - notebooks/object-detection.ipynb
    - AUDIT.md
    - DATA.md
    - COLAB.md
  render:
    - index.qmd

website:
  title: "Synthetic Object Detection"
  description: "A custom ResNet18 detector and YOLOv8n on a controlled single-object task."
  navbar:
    left:
      - href: index.qmd
        text: Report
      - text: Notebook
        href: notebooks/object-detection.ipynb
    right:
      - icon: github
        href: https://github.com/O-2wice/synthetic-object-detection
        aria-label: GitHub repository

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    smooth-scroll: true
    df-print: paged

execute:
  freeze: auto
  cache: false
  warning: false
  message: false
